# The login theme of OpenDevTrack (ADR-24 point 2, O5; ASVS 2.1.8): the login pages of Keycloak 26 (keycloak.v2) with
# the logo and colours of brand/ and a strength meter where a password is chosen. The policy that refuses a password
# stays the realm's: the meter only advises.
#
# The images come from brand/ as they are: an installation puts brand/ in resources/brand and brand/favicon.ico in
# resources/img (the compose files mount them; see keycloak/README.md).
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/opendevtrack.css
scripts=js/strength.js

locales=en,it
