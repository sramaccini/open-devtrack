# Tests that start the application: no identity provider (the login uses a provider whose endpoints are never called,
# so nothing is discovered at startup), the database and Redis from TestInfrastructure.
spring:
  security:
    oauth2:
      client:
        registration:
          iam:
            provider: offline
            client-secret: test
        provider:
          offline:
            authorization-uri: http://iam.invalid/auth
            token-uri: http://iam.invalid/token
            jwk-set-uri: http://iam.invalid/certs
            user-info-uri: http://iam.invalid/userinfo
            user-name-attribute: preferred_username
authz:
  bff:
    # The sessions of the tests have no time of the login: the recent login is checked by RecentLoginTest alone
    recent-login:
      paths: ""
    # The tests of one context send more than 600 requests a minute as the same users: the limit is checked by
    # SessionRateLimitTest alone, with its own
    session-rate-limit:
      max-requests: 1000000
odt:
  secrets:
    # A key for the tests only (ADR-23); an installation generates its own.
    key: test-key-of-the-secrets-at-rest-not-for-use
