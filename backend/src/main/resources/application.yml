server:
  port: ${PORT:8080}
  shutdown: graceful
  # Behind the Quadrava runtime image (QUADRAVA_BFF_URL) or another trusted proxy: X-Forwarded-Host and
  # X-Forwarded-Proto give the public address to the login callback and to the check of the return page.
  forward-headers-strategy: framework
  servlet:
    session:
      # Sliding inactivity timeout; the absolute lifetime is authz.bff.session.absolute-timeout
      timeout: 30m
      cookie:
        # The __Host- prefix (ASVS 3.4.4): the browser takes the cookie only if it is Secure, has Path=/ and no Domain,
        # so no subdomain or other path can set or shadow it. The development profile keeps SESSION_ID, on http.
        name: __Host-SESSION_ID
        path: /
        http-only: true
        secure: true
        # Lax, not Strict: the cookie must come back with the return from the identity provider (a cross-site
        # navigation). Writes stay protected by the CSRF token and the Origin check of the BFF.
        same-site: lax

spring:
  application:
    name: opendevtrack
  servlet:
    multipart:
      # One file per request, up to odt.attachments.max-size; the request carries a little more than the file
      max-file-size: ${odt.attachments.max-size}
      max-request-size: ${ODT_ATTACHMENTS_MAX_REQUEST_SIZE:26MB}
  mvc:
    async:
      # Event streams (live data sources of Quadrava): no time limit
      request-timeout: -1
  web:
    # The language of a request is its Accept-Language; without one, English (the texts of the messages, ADR-13)
    locale: en
    locale-resolver: accept-header
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opendevtrack}
    username: ${DB_USER:opendevtrack}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
  session:
    data:
      redis:
        namespace: opendevtrack
        # indexed: index by user name, used by the revocation of sessions
        repository-type: indexed
  flyway:
    # One schema and one folder per module (ADR-04), all under db/odt with one history table in odt: the version
    # numbers are global across the folders (V1 uiregistry, V2 access, V3 project, V4 issue, V5 the event
    # publications, …). The RBAC schema has its own Flyway and history, run by authz-rbac.
    schemas: odt,odt_uiregistry,odt_access,odt_project,odt_issue,odt_audit,odt_collaboration,odt_workflow,odt_notification,odt_agile,odt_search,odt_reporting,odt_integration,odt_privacy
    locations: classpath:db/odt
    placeholders:
      # The days of the reports (ADR-17), also in the migration that fills them from the existing data
      reporting_zone: ${odt.reporting.zone}
  modulith:
    events:
      # Event Publication Registry in odt (table from V5): a listener that fails keeps its event, republished at the
      # next start; the completed ones are removed.
      jdbc:
        schema: odt
        schema-initialization:
          enabled: false
      completion-mode: delete
      republish-outstanding-events-on-restart: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          iam:
            provider: iam
            client-id: ${IAM_CLIENT_ID:opendevtrack-bff}
            client-secret: ${IAM_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          iam:
            issuer-uri: ${IAM_ISSUER_URI:http://localhost:8180/realms/opendevtrack}
            user-name-attribute: preferred_username

springdoc:
  # The OpenAPI definition of /api at /v3/api-docs (ADR-21), kept in docs/openapi.json; the instance serves no Swagger UI
  api-docs:
    version: openapi_3_1
  paths-to-match: /api/**
  # The RBAC administration of authz-library has its own definition, in that library
  paths-to-exclude: /api/v1/admin/**
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

authz:
  rbac:
    # The tables of authz-library in a schema of their own, next to the odt_* schemas of the modules (ADR-04; A2)
    schema: authz
    flyway:
      # The schema of authz-library, then the permission catalogue of OpenDevTrack (ADR-07)
      locations: classpath:db/authz/migration,classpath:db/authz/odt
  bff:
    frontend:
      login-success-url: ${FRONTEND_URL:http://localhost:8090}/
      login-failure-url: ${FRONTEND_URL:http://localhost:8090}/login-error
      post-logout-url: ${FRONTEND_URL:http://localhost:8090}/
      allowed-origins:
        - ${FRONTEND_URL:http://localhost:8090}
    session:
      absolute-timeout: 10h
    # Keycloak tells the BFF when one of its sessions ends (a logout elsewhere, Sign out in its console, a new password
    # with sign out from other devices), and the sessions of the BFF end with it (ADR-23, A7; ASVS 3.3.3, 3.3.4)
    backchannel-logout:
      enabled: true
    # Tools and integrations without a session (the Quadrava CLI, scripts, service accounts) send a Keycloak access
    # token, resolved to the permissions of a session of its user on the tenant of X-Tenant (ADR-03, ADR-21; A4).
    # Limited to 600 requests a minute per user, counted on Redis.
    bearer:
      enabled: true
      paths: /api/**,/registry/**,/v3/api-docs,/telemetry/**
      # The clients (azp) whose tokens are accepted: the tools client and the service accounts of the installation
      allowed-clients: ${ODT_BEARER_CLIENTS:opendevtrack-tools}
    # The same limit on the requests with a session, per user across their sessions (ADR-24, A9): 429 with Retry-After
    session-rate-limit:
      enabled: true
      paths: /api/**,/telemetry/**
      max-requests: ${ODT_SESSION_RATE_LIMIT:600}
    # A login younger than max-age before the sensitive actions of a browser session (ADR-24 point 4, O9, A8; ASVS
    # 3.7.1, 4.3.3): an older one gets 401 recent-login-required, and the Quadrava runtime (0.17.0, Q23) sends the user
    # to /bff/login with max_age, where Keycloak asks for the password again. Requests with a token are not checked.
    recent-login:
      max-age: ${ODT_RECENT_LOGIN_MAX_AGE:15m}
      paths:
        # The export and the removal of a user's data; the export is a download step of the runtime (Quadrava 0.18.0,
        # Q24), not a link, so its 401 becomes a new login too
        - GET /api/admin/users/*/export
        - POST /api/admin/**
        - PUT /api/admin/**
        - PATCH /api/admin/**
        - DELETE /api/admin/**
        # The changes of the admin API of authz-library: users, roles, tenants
        - POST /api/v1/admin/**
        - PUT /api/v1/admin/**
        - PATCH /api/v1/admin/**
        - DELETE /api/v1/admin/**
        # Permission schemes and groups of the tenant, the groups and the scheme of a project
        - POST /api/permission-schemes/**
        - PUT /api/permission-schemes/**
        - PATCH /api/permission-schemes/**
        - DELETE /api/permission-schemes/**
        - POST /api/groups/**
        - PUT /api/groups/**
        - PATCH /api/groups/**
        - DELETE /api/groups/**
        - POST /api/projects/*/groups/**
        - PUT /api/projects/*/groups/**
        - DELETE /api/projects/*/groups/**
        - PUT /api/projects/*/permission-scheme
        # Workflows and their schemes
        - POST /api/projects/*/workflow/**
        - PUT /api/projects/*/workflow/**
        - PATCH /api/projects/*/workflow/**
        - DELETE /api/projects/*/workflow/**
        - POST /api/projects/*/workflows/**
        - PUT /api/projects/*/workflows/**
        - PATCH /api/projects/*/workflows/**
        - DELETE /api/projects/*/workflows/**
        # Webhooks: where the events go, and their secrets
        - POST /api/projects/*/webhooks/**
        - PUT /api/projects/*/webhooks/**
        # Personal access tokens
        - POST /api/v1/tokens

odt:
  secrets:
    # The key that encrypts the secrets at rest (ADR-23: the secrets of the webhooks), at least 32 characters; the
    # back end does not start without it. To rotate it: a new key with a new id, the old one in previous-keys
    # ("id=key,id=key") until the next start has written every secret again under the new one.
    key: ${ODT_SECRET_KEY:}
    key-id: ${ODT_SECRET_KEY_ID:1}
    previous-keys: ${ODT_SECRET_KEYS_PREVIOUS:}
    # Where the key lives (ADR-24): local (the key above, in memory) or transit (Vault or OpenBao; the key above is
    # then needed only while values under it remain, and they are moved to transit at start)
    plugin: ${ODT_SECRETS_PLUGIN:local}
    transit:
      address: ${ODT_SECRETS_TRANSIT_ADDRESS:}
      mount: ${ODT_SECRETS_TRANSIT_MOUNT:transit}
      key: ${ODT_SECRETS_TRANSIT_KEY:opendevtrack}
      # A token with update on <mount>/encrypt/<key> and <mount>/decrypt/<key>; the file is read at each call
      token: ${ODT_SECRETS_TRANSIT_TOKEN:}
      token-file: ${ODT_SECRETS_TRANSIT_TOKEN_FILE:}
  audit:
    # How long the audit log of the administration is kept (ADR-22), deleted once a night after that.
    retention: ${ODT_AUDIT_RETENTION:P730D}
  attachments:
    # Where the bytes of the attachments are kept (ADR-14): database (default), filesystem or s3. Changing it on an
    # installation that has attachments is a migration: the back end does not start.
    store: ${ODT_ATTACHMENTS_STORE:database}
    max-size: ${ODT_ATTACHMENTS_MAX_SIZE:25MB}
    # The bytes of all the attachments of a project (ADR-24): unlimited when empty, for example 5GB
    project-quota: ${ODT_ATTACHMENTS_PROJECT_QUOTA:}
    # An antivirus before each file is stored (ADR-24): clamd over TCP, on when its host is set
    # (ODT_ATTACHMENTS_SCAN_CLAMD_HOST); a file it cannot look at is refused (503) unless fail-open is true.
    # scan:
    #   clamd:
    #     host: clamav
    #     port: 3310
    #     timeout: 30s
    #   fail-open: false
    # filesystem:
    #   root: /var/lib/opendevtrack/attachments
    # s3:
    #   bucket: opendevtrack
    #   prefix: attachments/
    #   endpoint: http://minio:9000    # absent for AWS S3
    #   region: us-east-1
    #   path-style: true               # MinIO and most S3-compatible servers
    #   access-key / secret-key: from ODT_ATTACHMENTS_S3_ACCESS_KEY and ODT_ATTACHMENTS_S3_SECRET_KEY, or the AWS chain
  reporting:
    # Time zone of the days of search dates and reports (ADR-16, ADR-17); the snapshot of each project is written
    # again every night, so a day with no change still has its row.
    zone: ${ODT_REPORTING_ZONE:UTC}
    snapshot-cron: "0 5 0 * * *"
  # How long a day and a week of time tracking are (ADR-30): 1d is 8 hours, 1w 5 days.
  time-tracking:
    hours-per-day: ${ODT_TIME_TRACKING_HOURS_PER_DAY:8}
    days-per-week: ${ODT_TIME_TRACKING_DAYS_PER_WEEK:5}
  # The telemetry of the Quadrava runtime (contracts/telemetry.yaml, #57): traces and logs of the screens, redacted a
  # second time, go to the OTLP/HTTP collector of the installation (http://collector:4318); without one they are
  # accepted and dropped.
  telemetry:
    otlp-endpoint: ${ODT_TELEMETRY_OTLP_ENDPOINT:}
    max-bytes: ${ODT_TELEMETRY_MAX_BYTES:1000000}
    max-in-flight: 16
  # The address of the application for the links of the mails (ADR-18)
  public-url: ${ODT_PUBLIC_URL:${FRONTEND_URL:http://localhost:8090}}
  mail:
    # Email notifications (ADR-18) are on only when spring.mail.host is set (SPRING_MAIL_HOST, SPRING_MAIL_PORT,
    # SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, and spring.mail.properties for TLS); without it nothing is mailed.
    from: ${ODT_MAIL_FROM:OpenDevTrack <noreply@localhost>}
    # The daily digest, at this time in the zone of odt.reporting.zone
    digest-at: ${ODT_MAIL_DIGEST_AT:07:00}
    # How often the outbox is read
    outbox-delay: ${ODT_MAIL_OUTBOX_DELAY:PT1M}
  webhooks:
    # Outgoing webhooks (ADR-21, B): only https to public addresses. A development environment with a receiver on
    # its own network allows http and private addresses with ODT_WEBHOOKS_ALLOW_PRIVATE=true.
    allow-private: ${ODT_WEBHOOKS_ALLOW_PRIVATE:false}
    # Only these hosts, separated by commas, still at public addresses (ADR-25): the public demo allows only its echo.
    # Empty, the default, means every public host.
    allowed-hosts: ${ODT_WEBHOOKS_ALLOWED_HOSTS:}
    # How often the deliveries that are due are posted
    delay: ${ODT_WEBHOOKS_DELAY:PT15S}
  uiregistry:
    # Environments where only versions approved by someone other than their author are published: none (ADR-12, the
    # review is the one of the code). An installation that wants it lists them:
    # protected-environments: testing,production

management:
  endpoints:
    web:
      exposure:
        # prometheus answers only on the management port of the installation (ADR-24, docs/operations)
        include: health,info,prometheus
  health:
    mail:
      # A mail server that does not answer does not make the instance unhealthy: the outbox tries again (ADR-18).
      enabled: false
