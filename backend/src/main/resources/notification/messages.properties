# Texts of the messages for the user (module notification, ADR-13), in English; messages_it.properties in Italian.
# {0} who did it, {1} the issue, {2} a status.
message.mentioned.title={0} mentioned you in {1}
message.assigned.title={0} assigned {1} to you
message.review_requested.title={0} asked you to review {1}
message.commented.title={0} commented on {1}
message.transitioned.title={0} moved {1} to {2}
message.transitioned.text=From {0} to {1}
# The statuses of the built-in workflow (ADR-10); the others are shown by their code.
status.todo=To do
status.in_progress=In progress
status.done=Done
# Mails (ADR-18), plain text. {0} the issue key, {1} its summary, {2} a link, {3} a number.
mail.subject=[OpenDevTrack] {0} {1}
mail.digest.subject=[OpenDevTrack] Your daily summary: {3} updates
mail.digest.intro=What happened in OpenDevTrack since your last summary:
mail.open=Open the issue: {2}
mail.footer=You get these mails because of your notification settings: {2}
# The notification settings (ADR-18): one row per kind, in the application and by email.
preference.mentioned=Mentioned in a comment
preference.assigned=Assigned to you
preference.review_requested=Asked to review
preference.commented=Comment on an issue you watch
preference.transitioned=Status change of an issue you watch
preference.app={0}: in the application
preference.email={0}: by email
preference.email.off=Off
preference.email.instant=At once
preference.email.daily=In the daily summary
