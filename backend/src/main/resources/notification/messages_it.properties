# Texts of the messages for the user (module notification, ADR-13), in Italian.
# {0} who did it, {1} the issue, {2} a status.
message.mentioned.title={0} ti ha menzionato in {1}
message.assigned.title={0} ti ha assegnato {1}
message.review_requested.title={0} ti ha chiesto di rivedere {1}
message.commented.title={0} ha commentato {1}
message.transitioned.title={0} ha spostato {1} in {2}
message.transitioned.text=Da {0} a {1}
# The statuses of the built-in workflow (ADR-10); the others are shown by their code.
status.todo=Da fare
status.in_progress=In corso
status.done=Fatta
# Mail (ADR-18), testo semplice. {0} la chiave della issue, {1} il titolo, {2} un link, {3} un numero.
mail.subject=[OpenDevTrack] {0} {1}
mail.digest.subject=[OpenDevTrack] Il riepilogo del giorno: {3} novità
mail.digest.intro=Cosa è successo in OpenDevTrack dall'ultimo riepilogo:
mail.open=Apri la issue: {2}
mail.footer=Ricevi queste mail per le tue impostazioni delle notifiche: {2}
# Le impostazioni delle notifiche (ADR-18): una riga per tipo, nell'applicazione e per mail.
preference.mentioned=Menzione in un commento
preference.assigned=Issue assegnata a te
preference.review_requested=Revisione chiesta a te
preference.commented=Commento su una issue che segui
preference.transitioned=Cambio di stato di una issue che segui
preference.app={0}: nell''applicazione
preference.email={0}: per mail
preference.email.off=No
preference.email.instant=Subito
preference.email.daily=Nel riepilogo del giorno
