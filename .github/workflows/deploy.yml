name: Installation

# The check of deploy/compose (ADR-25 point 2): the production Compose file with Caddy and Keycloak, an image of the
# back end built from these sources, the realm template, the first administrator and the screens of ui/, then a
# login over https (e2e/deploy/run.sh). On main when what it installs changes, and for each tag from release.yml,
# before anything is published.

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - deploy/**
      - e2e/deploy/**
      - keycloak/**
      - backend/Dockerfile
      - backend/pom.xml
      - backend/src/main/resources/application.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGES_TOKEN: ${{ secrets.AUTHZ_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  compose:
    name: Compose installation (Caddy, Keycloak, first admin, ui/)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The jar is built here, with the Maven repository that CI saves, and the image takes it: Maven in
      # Docker would download every dependency from Maven Central again, which answers 429 to the runners (#47)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          server-id: authz-library
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN
      # The Maven repository that the back end job of ci.yml saves (#47)
      - uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Jar of the back end
        env:
          PACKAGES_USER: ${{ github.actor }}
        run: |
          mvn -B -q -f backend/pom.xml package -DskipTests
          echo "BACKEND_JAR=$(ls backend/target/opendevtrack-backend-*.jar | grep -vE -- '-(sources|javadoc)\.jar$' | head -1)" >> "$GITHUB_ENV"
      - name: Install and start
        run: e2e/deploy/run.sh up
      - name: Check
        run: e2e/deploy/run.sh check
      - name: Logs
        if: failure()
        run: |
          docker compose --project-directory deploy/compose -f deploy/compose/compose.yaml -f e2e/deploy/compose.yaml \
            --env-file e2e/deploy/.work/.env logs --no-color --tail 300
      - name: Down
        if: always()
        run: e2e/deploy/run.sh down
