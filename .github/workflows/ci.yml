name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# authz-library is read from GitHub Packages, which wants a token also to read (backend/README.md). The secret
# AUTHZ_PACKAGES_TOKEN (a token with read:packages) is used when set; otherwise the token of the workflow, which works
# once the authz-library packages grant this repository read access.
env:
  PACKAGES_TOKEN: ${{ secrets.AUTHZ_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  backend:
    name: Back end (build, modules, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: authz-library
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN
      # ModularityTests, the registry with its schemas and the ui/ documents; RegistryApiTest on PostgreSQL and Redis
      # with Testcontainers (Docker of the runner)
      - name: Build and test
        env:
          PACKAGES_USER: ${{ github.actor }}
        run: mvn -B -f backend/pom.xml verify

  e2e:
    name: End to end (Quadrava kits, ui/ on the registry)
    runs-on: ubuntu-24.04
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: authz-library
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # PostgreSQL, Redis, Keycloak, the back end (profile dev) and the Quadrava runtime; ui/ published to development.
      # Then the BFF, authorization and registry kits and the tenant checks (docs/check-authz-end-to-end.md).
      - name: Start the stack
        env:
          PACKAGES_USER: ${{ github.actor }}
        run: e2e/authz/run.sh up
      - name: Checks
        run: e2e/authz/run.sh check
      - name: Logs of the back end
        if: failure()
        run: tail -n 300 e2e/authz/.work/backend.log || true
      - name: Stop the stack
        if: always()
        run: e2e/authz/run.sh down || true
