name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# authz-library and the Quadrava CLI are read from GitHub Packages, which wants a token also to read
# (backend/README.md, ui/README.md). The secret AUTHZ_PACKAGES_TOKEN (a token with read:packages) is used when set;
# otherwise the token of the workflow, which works once the packages grant this repository read access.
env:
  PACKAGES_TOKEN: ${{ secrets.AUTHZ_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
  # The CLI of the Quadrava release in use (as in e2e/authz/run.sh).
  QUADRAVA_CLI: '@sramaccini/quadrava-cli@0.14.0'

jobs:
  ui:
    name: Screens (quadrava validate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@sramaccini'
      # Schemas, references to data sources, CEL expressions, themes and catalogues of ui/, as the runtime reads them
      - name: Validate ui/
        env:
          NODE_AUTH_TOKEN: ${{ env.PACKAGES_TOKEN }}
        run: npx --yes "$QUADRAVA_CLI" validate ui

  backend:
    name: Back end (build, modules, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: authz-library
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN
      # ModularityTests, the registry with its schemas and the ui/ documents; RegistryApiTest on PostgreSQL and Redis
      # with Testcontainers (Docker of the runner)
      - name: Build and test
        env:
          PACKAGES_USER: ${{ github.actor }}
        run: mvn -B -f backend/pom.xml verify

  dependencies:
    name: Dependencies (OSV-Scanner)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: authz-library
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # Every dependency of the back end as Maven resolves it (the transitive ones and authz-library too), as a CycloneDX
      # SBOM; with the lock file of the accessibility check (ADR-23)
      - name: Bill of materials of the back end
        env:
          PACKAGES_USER: ${{ github.actor }}
        run: mvn -B -q -f backend/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json -DoutputName=bom
      - name: Known vulnerabilities (osv.dev)
        uses: google/osv-scanner-action/osv-scanner-action@v2.2.1
        continue-on-error: true
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --format=json
            --output=osv.json
            -L
            backend/target/bom.json
            -L
            e2e/a11y/package-lock.json
      - name: High or critical fail
        run: node .github/osv/check.mjs osv.json

  e2e:
    name: End to end (Quadrava kits, ui/ on the registry)
    runs-on: ubuntu-24.04
    needs: [ui, backend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: authz-library
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@sramaccini'
      # PostgreSQL, Redis, Keycloak, the back end (profile dev) and the Quadrava runtime; ui/ published to development
      # with the Quadrava CLI.
      # Then the BFF, authorization and registry kits and the tenant checks (docs/check-authz-end-to-end.md).
      - name: Start the stack
        env:
          PACKAGES_USER: ${{ github.actor }}
          NODE_AUTH_TOKEN: ${{ env.PACKAGES_TOKEN }}
        run: e2e/authz/run.sh up
      # The Chromium of Playwright for the accessibility check (axe-core, ADR-23)
      - name: Browser for axe-core
        working-directory: e2e/a11y
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org && npx playwright install --with-deps chromium
      - name: Checks
        run: e2e/authz/run.sh check
      - name: ZAP baseline scan, signed in
        if: success() || failure()
        run: e2e/authz/run.sh zap
      - name: Reports of axe-core and ZAP
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: security-reports
          path: |
            e2e/authz/.work/axe.json
            e2e/authz/.work/zap/zap.html
            e2e/authz/.work/zap/zap.json
          if-no-files-found: ignore
      - name: Logs of the back end
        if: failure()
        run: tail -n 300 e2e/authz/.work/backend.log || true
      - name: Stop the stack
        if: always()
        run: e2e/authz/run.sh down || true
