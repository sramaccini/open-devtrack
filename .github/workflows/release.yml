name: Release

# A tag vX.Y.Z publishes the image of the back end to ghcr.io/sramaccini/opendevtrack-backend, signed without keys
# with cosign and the OIDC identity of this workflow (Sigstore), with the CycloneDX SBOM attached as a signed
# attestation, and a GitHub release with the SBOM (ADR-24 point 1, open item O4, ASVS 1.14.2). How an installation
# checks both: docs/operations/README.md, «Verifying the image».
#
# A tag vX.Y.Z-rc.N is a release candidate (ADR-25 point 4): the same image, signature, SBOM and archive, but the
# image gets only its own tag (never X.Y or latest) and the GitHub release is a pre-release. Before anything is
# published, the installation of deploy/compose is checked (deploy.yml). The steps around a tag: docs/release.md.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGES_TOKEN: ${{ secrets.AUTHZ_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
  IMAGE: ghcr.io/sramaccini/opendevtrack-backend

jobs:
  test:
    name: Back end (build, modules, tests)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          server-id: authz-library
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN
      # The Maven repository that the back end job of ci.yml saves (#47)
      - uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Build and test
        env:
          PACKAGES_USER: ${{ github.actor }}
        run: mvn -B -f backend/pom.xml verify

  # The installation as docs/admin/installation.md describes it, with an image built from the sources of the tag
  install:
    name: Installation (deploy/compose)
    needs: test
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  image:
    name: Image, signature, SBOM and archive
    runs-on: ubuntu-24.04
    needs: [test, install]
    permissions:
      contents: write   # the GitHub release
      packages: write   # the image on ghcr.io
      id-token: write   # the OIDC identity that cosign signs with
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          server-id: authz-library
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN
      # The Maven repository that the back end job of ci.yml saves (#47)
      - uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Version of the tag in the pom
        env:
          PACKAGES_USER: ${{ github.actor }}
        run: mvn -B -q -f backend/pom.xml versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      # Every dependency as Maven resolves it, authz-library and the transitive ones included (as in ci.yml)
      - name: Bill of materials
        env:
          PACKAGES_USER: ${{ github.actor }}
        run: mvn -B -q -f backend/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json -DoutputName=bom
      # The jar of the tag is built here, with the Maven repository that CI saves, and the image takes it
      # (build context "dist"): Maven in Docker would download every dependency from Maven Central again, which
      # answers 429 to the runners (#47)
      - name: Jar of the back end
        env:
          PACKAGES_USER: ${{ github.actor }}
        run: |
          mvn -B -q -f backend/pom.xml package -DskipTests
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$(ls backend/target/opendevtrack-backend-*.jar | grep -vE -- '-(sources|javadoc)\.jar$' | head -1)" "$RUNNER_TEMP/dist/app.jar"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # For a candidate (a semver pre-release) the action gives only {{version}}, and latest only to a release
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=OpenDevTrack back end
            org.opencontainers.image.licenses=MPL-2.0
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: JAR=prebuilt
          build-contexts: dist=${{ runner.temp }}/dist
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      # Signed by digest, never by tag: a tag can be moved, the digest is the image
      - name: Sign the image and attest its SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate backend/target/bom.json "$IMAGE@$DIGEST"
      # What an installation needs besides the image (docs/admin/installation.md), with the layout of the repository so
      # that the relative paths of deploy/compose hold; .env.example names the image of this release by digest.
      - name: Archive of the installation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          sed -i "s|^ODT_BACKEND_IMAGE=.*|ODT_BACKEND_IMAGE=$IMAGE@$DIGEST|" deploy/compose/.env.example
          grep -qx "ODT_BACKEND_IMAGE=$IMAGE@$DIGEST" deploy/compose/.env.example
          tar --owner=0 --group=0 --transform "s|^|opendevtrack-${GITHUB_REF_NAME}/|" \
            -czf "opendevtrack-${GITHUB_REF_NAME}.tar.gz" \
            deploy ui keycloak brand LICENSE NOTICE TRADEMARKS.md CHANGELOG.md
          sha256sum "opendevtrack-${GITHUB_REF_NAME}.tar.gz" > "opendevtrack-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: GitHub release with the SBOM and the archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cp backend/target/bom.json "opendevtrack-backend-${GITHUB_REF_NAME}.cdx.json"
          prerelease=()
          case "$GITHUB_REF_NAME" in *-rc.*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${prerelease[@]}" \
            --notes "Image: \`$IMAGE@$DIGEST\`, signed with cosign (docs/operations/README.md, «Verifying the image»). Installation: the archive below, docs/admin/installation.md. Changes: CHANGELOG.md." \
            "opendevtrack-backend-${GITHUB_REF_NAME}.cdx.json" \
            "opendevtrack-${GITHUB_REF_NAME}.tar.gz" "opendevtrack-${GITHUB_REF_NAME}.tar.gz.sha256"
