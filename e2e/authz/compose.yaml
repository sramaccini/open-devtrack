# End-to-end check of the OpenDevTrack back end with authz-library (docs/check-authz-end-to-end.md).
# Development only: the credentials are generated by run.sh into .work/.env (gitignored).
name: odt-authz-e2e

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: opendevtrack
      POSTGRES_USER: opendevtrack
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run run.sh}
    ports:
      - "${DB_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "opendevtrack", "-d", "opendevtrack"]
      interval: 2s
      retries: 30

  redis:
    image: redis:8.2
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-26379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    # The same port inside and outside: the issuer seen by the browser and by the back end is the same address.
    command: ["start-dev", "--http-port=${KEYCLOAK_PORT:-28180}", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run run.sh}
      # Replaced in the placeholders of realm-opendevtrack.json
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:?run run.sh}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:?run run.sh}
      FRONT_URL: http://localhost:${FRONT_PORT:-28090}
    volumes:
      - ./realm-opendevtrack.json:/opt/keycloak/data/import/realm-opendevtrack.json:ro
    ports:
      - "${KEYCLOAK_PORT:-28180}:${KEYCLOAK_PORT:-28180}"

  # The front of OpenDevTrack (ADR-01): the Quadrava runtime forwards the BFF paths to the back end on the host.
  # runtime-config.json: the screens of the Quadrava demo, with session, permissions and tenants from the back end.
  runtime:
    image: ghcr.io/sramaccini/quadrava-runtime:0.1.0
    environment:
      QUADRAVA_BFF_URL: http://host.docker.internal:${APP_PORT:-28080}
    volumes:
      - ./runtime-config.json:/etc/quadrava/runtime-config.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONT_PORT:-28090}:8080"
