# OpenDevTrack on one host with Docker Compose (ADR-25 point 2; the guide is docs/admin/installation.md).
#
#   cp .env.example .env    then set every value (none of the examples works as it is)
#   ./odt.sh up             start; the back end creates its schemas on the first start
#   ./odt.sh first-admin    the first tenant and its global administrator, once
#   ./odt.sh publish-ui     the screens of ui/ into the registry of the back end, after each upgrade
#
# Two optional parts, chosen with COMPOSE_PROFILES in .env: "proxy" (Caddy: TLS with certificates of its own, and the
# one origin of the browser) and "keycloak" (a Keycloak with its database in the same PostgreSQL). An installation
# with its own proxy or identity provider leaves them out and follows the guide.
#
# The project has a name of its own, not the "opendevtrack" of stack/, so that the two never share containers or
# volumes on one host; ODT_PROJECT in .env gives another (the check of e2e/deploy uses one).
name: ${ODT_PROJECT:-opendevtrack-server}

services:
  # Two databases on one server: opendevtrack and keycloak, each owned by a role that is not a superuser
  # (postgres/init.sh, run on the first start only; asvs.md «The installation»).
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  # The sessions of the BFF and the rate limits (authz-library)
  redis:
    image: redis:8.2
    restart: unless-stopped
    command: ["sh", "-c", 'exec redis-server --appendonly no --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 2s
      retries: 30

  backend:
    # The image of a release, by digest (docs/operations/README.md, «Verifying the image»)
    image: ${ODT_BACKEND_IMAGE:?set in .env}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      # The back end reads the issuer when it starts; ignored without the profile keycloak. Keycloak can still answer
      # 503 for a few seconds while it imports the realm: the back end then stops and restart starts it again.
      keycloak: { condition: service_healthy, required: false }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/opendevtrack
      DB_USER: opendevtrack
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      IAM_ISSUER_URI: ${KEYCLOAK_URL:?set in .env}/realms/${KEYCLOAK_REALM:-opendevtrack}
      IAM_CLIENT_ID: ${IAM_CLIENT_ID:-opendevtrack-bff}
      IAM_CLIENT_SECRET: ${IAM_CLIENT_SECRET:?set in .env}
      FRONTEND_URL: ${ODT_URL:?set in .env}
      ODT_BEARER_CLIENTS: ${ODT_BEARER_CLIENTS:-opendevtrack-publisher}
      # Required unless the key is in Vault or OpenBao transit (ODT_SECRETS_PLUGIN=transit in backend.env)
      ODT_SECRET_KEY: ${ODT_SECRET_KEY:-}
      # The metrics and the health on a port of their own, never published (docs/operations)
      MANAGEMENT_SERVER_PORT: "9090"
    # The optional settings (mail, attachments, Vault transit, time zone…), only those that are set: an empty value
    # would count as set for some of them (docs/admin/configuration.md).
    env_file:
      - path: backend.env
        required: false
    healthcheck:
      # bash for /dev/tcp: /bin/sh of the image is dash, and the image has no curl
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9090 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      start_period: 120s
      retries: 60

  # The screens: the Quadrava runtime with the definitions of ui/ published in the registry of the back end
  # (environment production). The proxy sends the paths of the BFF to the back end, so QUADRAVA_BFF_URL is not set.
  runtime:
    image: ghcr.io/sramaccini/quadrava-runtime:0.20.1
    restart: unless-stopped
    environment:
      QUADRAVA_REGISTRY_APP: opendevtrack
      QUADRAVA_REGISTRY_ENV: production
      QUADRAVA_NAVIGATION: main
      QUADRAVA_THEMES: odt-light,odt-dark
      QUADRAVA_LANGUAGES: en,it
      QUADRAVA_DEFAULT_LANGUAGE: en
      QUADRAVA_TENANT_SWITCH_URL: /bff/tenant
      QUADRAVA_HSTS: ${QUADRAVA_HSTS:-max-age=31536000}
    volumes:
      # The logo and the icons of brand/, as they are (AGENTS.md §6)
      - ../../brand/svg:/usr/share/nginx/html/odt-brand:ro
      - ../../brand/png:/usr/share/nginx/html/odt-brand-png:ro

  # TLS and the one origin of the browser (profile proxy, Caddyfile): certificates from Let's Encrypt for public
  # names, from a local authority of its own for *.localhost.
  proxy:
    image: caddy:2.10
    profiles: [proxy]
    restart: unless-stopped
    depends_on: [backend, runtime]
    environment:
      ODT_HOST: ${ODT_HOST:?set in .env}
      KEYCLOAK_HOST: ${KEYCLOAK_HOST:-keycloak.localhost}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  # The identity provider (profile keycloak): the realm of deploy/keycloak, imported on the first start, with the
  # login theme of keycloak/ and the list of breached passwords of its password policy.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    profiles: [keycloak]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env with the profile keycloak}
      # The public address: the issuer of the tokens, checked by the back end
      KC_HOSTNAME: ${KEYCLOAK_URL}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # A temporary administrator of the master realm: replace it after the first login (docs/admin/keycloak.md)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env with the profile keycloak}
      # Replaced in the placeholders of the realm
      ODT_URL: ${ODT_URL}
      IAM_CLIENT_SECRET: ${IAM_CLIENT_SECRET}
      PUBLISHER_CLIENT_SECRET: ${PUBLISHER_CLIENT_SECRET:?set in .env}
      BFF_BACKCHANNEL_URL: http://backend:8080/bff/backchannel-logout
    volumes:
      - ../keycloak/realm-opendevtrack.json:/opt/keycloak/data/import/realm-opendevtrack.json:ro
      - ${PASSWORD_BLACKLISTS:-./password-blacklists}:/opt/keycloak/data/password-blacklists:ro
      # The login theme of OpenDevTrack, its parts one by one so that brand/ is mounted as it is next to them
      - ../../keycloak/themes/opendevtrack/login/theme.properties:/opt/keycloak/themes/opendevtrack/login/theme.properties:ro
      - ../../keycloak/themes/opendevtrack/login/resources/css:/opt/keycloak/themes/opendevtrack/login/resources/css:ro
      - ../../keycloak/themes/opendevtrack/login/resources/js:/opt/keycloak/themes/opendevtrack/login/resources/js:ro
      - ../../brand:/opt/keycloak/themes/opendevtrack/login/resources/brand:ro
      - ../../brand/favicon.ico:/opt/keycloak/themes/opendevtrack/login/resources/img/favicon.ico:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      start_period: 60s
      retries: 60

  # Publishes ui/ with the Quadrava CLI of the pinned version (./odt.sh publish-ui); not started by up.
  publish:
    image: node:24-alpine
    profiles: [tools]
    working_dir: /work
    environment:
      NODE_AUTH_TOKEN: ${PACKAGES_TOKEN:-}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-opendevtrack}
      PUBLISHER_CLIENT_ID: ${PUBLISHER_CLIENT_ID:-opendevtrack-publisher}
      PUBLISHER_CLIENT_SECRET: ${PUBLISHER_CLIENT_SECRET}
    volumes:
      - ../../ui:/work/ui:ro
      - ./npmrc:/work/.npmrc:ro
      - ./publish-ui.mjs:/work/publish-ui.mjs:ro
    command: ["node", "publish-ui.mjs"]

volumes:
  pgdata:
  caddy-data:
